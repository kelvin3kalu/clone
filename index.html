<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bank UI Clone</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#000;
      color:white;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:100vh;
      padding:20px;
    }

    .phone{
      width:370px;
    }

    .top-icons{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:40px;
    }

    .circle-btn{
      width:55px;
      height:55px;
      border-radius:50%;
      background:#1b1b1d;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:28px;
      color:white;
    }

    .profile-section{
      text-align:center;
      margin-bottom:35px;
    }

    .profile-wrapper{
      position:relative;
      width:120px;
      margin:auto;
    }

    .profile{
      width:120px;
      height:120px;
      border-radius:50%;
      background:#7c4dff;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:42px;
      font-weight:bold;
      margin:auto;
    }

    .plus{
      position:absolute;
      bottom:10px;
      right:0;
      width:34px;
      height:34px;
      border-radius:50%;
      background:white;
      color:black;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:28px;
      font-weight:bold;
    }

    .company{
      font-size:22px;
      margin-top:20px;
      font-weight:500;
    }

    .amount{
      font-size:78px;
      font-weight:bold;
      margin-top:25px;
    }

    .date{
      color:#888;
      font-size:20px;
      margin-top:10px;
    }

    .card{
      background:#111114;
      border-radius:28px;
      padding:25px;
      margin-top:22px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:28px;
    }

    .row:last-child{
      margin-bottom:0;
    }

    .label{
      color:#8a8a8f;
      font-size:18px;
    }

    .value{
      color:#5b8dff;
      font-size:18px;
      font-weight:500;
    }

    .download{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .toggle{
      width:55px;
      height:30px;
      background:#444;
      border-radius:20px;
      position:relative;
    }

    .toggle::before{
      content:"";
      width:24px;
      height:24px;
      background:white;
      border-radius:50%;
      position:absolute;
      top:3px;
      left:3px;
    }

    .bottom{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:25px;
      font-size:18px;
      font-weight:500;
    }

    .arrow{
      color:#666;
      font-size:30px;
    }

  </style>
</head>
<body>

  <div class="phone">

    <div class="top-icons">
      <div class="circle-btn">←</div>
      <div class="circle-btn">⋯</div>
    </div>

    <div class="profile-section">

      <div class="profile-wrapper">
        <div class="profile">BG</div>
        <div class="plus">+</div>
      </div>

      <div class="company">BKUK GROUP LIMITED</div>

      <div class="amount">+£132</div>

      <div class="date">Yesterday, 17:08</div>

    </div>

    <div class="card">

      <div class="row">
        <div class="label">To</div>
        <div class="value">R&nbsp;&nbsp; Personal · GBP</div>
      </div>

      <div class="row">
        <div class="label">Statement</div>

        <div class="value download">
          ⬇ Download
        </div>
      </div>

    </div>

    <div class="card">

      <div class="row">
        <div class="label">Exclude from analytics</div>
        <div class="toggle"></div>
      </div>

      <div class="row">
        <div class="label">Category</div>
        <div class="value">👥 Top ups</div>
      </div>

      <div class="row">
        <div class="label">Total received</div>
        <div style="font-size:22px;">£328</div>
      </div>

      <div class="bottom">
        <div>See all 2 transactions</div>
        <div class="arrow">›</div>
      </div>

    </div>

    <div class="card">

      <div class="bottom">
        <div>Get help</div>
        <div class="arrow">›</div>
      </div>

    </div>

  </div>

</body>
</html>
