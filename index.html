<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bank UI Clone</title>

  <style>
    /* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  background:#000;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
}

/* =========================
   PHONE CONTAINER
========================= */

.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  padding:20px 18px 40px;
}

/* =========================
   TOP ICONS
========================= */

.top-icons{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:10px;
  margin-bottom:35px;
}

.circle-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#161618;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:24px;
}

/* =========================
   PROFILE SECTION
========================= */

.profile-section{
  text-align:center;
}

.profile-wrapper{
  width:120px;
  position:relative;
  margin:auto;
}

.profile{
  width:120px;
  height:120px;
  border-radius:50%;
  background:#7b4dff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  font-weight:bold;
}

.plus{
  position:absolute;
  right:0;
  bottom:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:white;
  color:black;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  font-weight:bold;
}

.company{
  margin-top:22px;
  font-size:22px;
  font-weight:500;
}

.amount{
  margin-top:20px;
  font-size:72px;
  font-weight:bold;
  letter-spacing:-2px;
}

.date{
  margin-top:10px;
  color:#8b8b90;
  font-size:18px;
}

/* =========================
   CARD
========================= */

.card{
  background:#111114;
  border-radius:30px;
  padding:24px 22px;
  margin-top:22px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:26px;
}

.row:last-child{
  margin-bottom:0;
}

.label{
  color:#8b8b90;
  font-size:17px;
}

.value{
  color:#5f8dff;
  font-size:17px;
  font-weight:500;
}

.download{
  display:flex;
  align-items:center;
  gap:8px;
}

/* =========================
   TOGGLE
========================= */

.toggle{
  width:54px;
  height:31px;
  background:#4b4b4f;
  border-radius:20px;
  position:relative;
}

.toggle::before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  background:white;
  border-radius:50%;
  top:3.5px;
  left:4px;
}

/* =========================
   BOTTOM ROW
========================= */

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:18px;
  font-weight:500;
}

.arrow{
  color:#686868;
  font-size:30px;
}

/* =========================
   MOBILE RESPONSIVE
========================= */

@media(max-width:480px){

  .phone{
    padding:18px 14px 35px;
  }

  .circle-btn{
    width:46px;
    height:46px;
    font-size:22px;
  }

  .profile-wrapper{
    width:105px;
  }

  .profile{
    width:105px;
    height:105px;
    font-size:38px;
  }

  .plus{
    width:30px;
    height:30px;
    font-size:22px;
  }

  .company{
    font-size:20px;
  }

  .amount{
    font-size:62px;
  }

  .date{
    font-size:16px;
  }

  .card{
    padding:22px 18px;
    border-radius:26px;
  }

  .label,
  .value{
    font-size:16px;
  }

  .bottom{
    font-size:16px;
  }

}
  </style>
</head>
<body>

  <div class="phone">

    <div class="top-icons">
      <div class="circle-btn">←</div>
      <div class="circle-btn">⋯</div>
    </div>

    <div class="profile-section">

      <div class="profile-wrapper">
        <div class="profile">BG</div>
        <div class="plus">+</div>
      </div>

      <div class="company">BKUK GROUP LIMITED</div>

      <div class="amount">+£52.93</div>

      <div class="date">Today, 17:08</div>

    </div>

    <div class="card">

      <div class="row">
        <div class="label">To</div>
        <div class="value">R&nbsp;&nbsp; Personal · GBP</div>
      </div>

      <div class="row">
        <div class="label">Statement</div>

        <div class="value download">
          ⬇ Download
        </div>
      </div>

    </div>

    <div class="card">

      <div class="row">
        <div class="label">Exclude from analytics</div>
        <div class="toggle"></div>
      </div>

      <div class="row">
        <div class="label">Category</div>
        <div class="value">👥 Top ups</div>
      </div>

      <div class="row">
        <div class="label">Total received</div>
        <div style="font-size:22px;">£340</div>
      </div>

      <div class="bottom">
        <div>See all 2 transactions</div>
        <div class="arrow">›</div>
      </div>

    </div>

    <div class="card">

      <div class="bottom">
        <div>Get help</div>
        <div class="arrow">›</div>
      </div>

    </div>

  </div>

</body>
</html>
